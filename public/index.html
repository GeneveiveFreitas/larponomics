<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kethercraft Stock Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Kethercraft Stock Market</h1>
      <p class="status" id="status" role="status" aria-live="polite">Connecting to market…</p>
      <div class="account-bar">
        <a id="discord-login" class="account-button" href="/api/auth/discord">Sign in with Discord</a>
        <div id="account-user" hidden>
          <img id="account-avatar" alt="" hidden>
          <span id="account-username"></span>
          <button id="logout-button" type="button">Sign out</button>
        </div>
      </div>
    </header>
    <section class="block invest-panel" aria-labelledby="invest-title">
      <h2 id="invest-title">Invest in selected stock</h2>
      <p id="invest-selection">Select a stock to get started.</p>
      <p id="daily-limit" aria-live="polite">Sign in to view your daily limit.</p>
      <p id="daily-owned"></p>
      <div class="invest-actions">
        <button type="button" data-buy-quantity="1" disabled>Buy 1</button>
        <button type="button" data-buy-quantity="5" disabled>Buy 5</button>
        <button type="button" data-buy-quantity="max" disabled>Buy max</button>
      </div>
      <p id="invest-message" role="status" aria-live="polite"></p>
      <div class="account-holdings">
        <h3>Your stocks</h3>
        <div id="account-holdings"></div>
      </div>
    </section>
    <div class="layout">
      <div class="block">
        <div class="list-controls">
          <label for="price-sort">Sort by price</label>
          <select id="price-sort">
            <option value="asc">Lowest first</option>
            <option value="desc">Highest first</option>
          </select>
        </div>
        <div class="list" id="list"></div>
      </div>
      <div>
        <div class="block">
          <div class="top">
            <div>
              <div class="sym detail-symbol" id="dSym"></div>
              <div class="nm" id="dName"></div>
            </div>
          </div>
          <div class="big" id="dPrice"></div>
          <canvas id="chart" width="800" height="280" aria-label="Price chart"></canvas>
          <div class="stats" id="stats"></div>
        </div>
      </div>
    </div>
  </div>
<script src="script.js" defer></script>
</body>
</html>
