<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home - Kethercraft Stock Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-top">
        <nav class="site-nav" aria-label="Main navigation">
          <a class="active" href="/index.html" aria-current="page">Home</a>
          <details class="site-nav-dropdown">
            <summary class="site-nav-trigger">Market</summary>
            <div class="site-nav-menu">
              <a href="/market.html">Market</a>
              <a href="/votes.html">Voting</a>
            </div>
          </details>
          <a href="/organizations.html">Organizations</a>
        </nav>
        <div class="account-bar">
          <a id="discord-login" class="account-button" href="/api/auth/discord">Sign In</a>
          <div id="account-user" hidden>
            <img id="account-avatar" alt="" hidden>
            <span id="account-username"></span>
            <button id="logout-button" type="button">Sign Out</button>
          </div>
        </div>
        <p id="account-message" class="account-message" role="status" aria-live="polite"></p>
      </div>
      <h1>Welcome to Kethercraft</h1>
    </header>
    <main class="block home-panel">
      <p></p>
      <div class="home-graphic">
        <img src="/images/Gatekeeper.png" alt="Gatekeeping">
      </div>
    </main>
  </div>
<script src="home.js" defer></script>
</body>
</html>
