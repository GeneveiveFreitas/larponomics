<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market - Kethercraft Stock Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-top">
        <nav class="site-nav" aria-label="Main navigation">
          <a href="/index.html">Home</a>
          <details class="site-nav-dropdown">
            <summary class="site-nav-trigger active">Market</summary>
            <div class="site-nav-menu">
              <a class="active" href="/market.html" aria-current="page">Market</a>
            </div>
          </details>
          <a class="admin-market-link" href="/admin-market.html" hidden>Market settings</a>
          <a href="/organizations.html">Organizations</a>
        </nav>
        <div class="account-bar">
          <a id="discord-login" class="account-button" href="/api/auth/discord">Sign In</a>
          <div id="account-user" hidden>
            <img id="account-avatar" alt="" hidden>
            <span id="account-username"></span>
            <button id="logout-button" type="button">Sign Out</button>
          </div>
        </div>
      </div>
      <h1>Kethercraft Stock Market</h1>
    </header>
    <aside class="market-event-banner" aria-labelledby="market-event-title">
      <h2 id="market-event-title">Market Event</h2>
      <div class="market-event-marquee">
        <div class="market-event-track">
          <div class="market-event-group" id="market-event-group"></div>
          <div class="market-event-group" id="market-event-group-copy" aria-hidden="true"></div>
        </div>
      </div>
    </aside>
    <div class="layout">
      <div class="block">
        <div class="list-controls">
          <label for="price-sort">Sort by price</label>
          <select id="price-sort">
            <option value="asc">Lowest first</option>
            <option value="desc">Highest first</option>
          </select>
        </div>
        <p class="market-message" id="market-message" role="status" aria-live="polite"></p>
        <div class="list" id="list"></div>
      </div>
      <div>
        <div class="block">
          <div class="top">
            <div>
              <div class="sym detail-symbol" id="dSym"></div>
              <div class="nm" id="dName"></div>
            </div>
          </div>
          <div class="big" id="dPrice"></div>
          <canvas id="chart" width="800" height="280" aria-label="Price chart"></canvas>
          <div class="stats" id="stats"></div>
        </div>
      </div>
    </div>
  </div>
<script src="script.js" defer></script>
</body>
</html>
